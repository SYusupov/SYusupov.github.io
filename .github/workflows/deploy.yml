name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer one waits instead of cancelling the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Check content
        shell: bash
        run: npm run check:content 2>&1 | tee check-content.log; exit "${PIPESTATUS[0]}"
      - name: ffmpeg for event videos
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Restore compressed videos
        id: video-cache
        uses: actions/cache/restore@v6
        with:
          path: .video-cache
          key: videos-${{ hashFiles('src/content/events/**/*.mp4', 'src/content/events/**/*.MP4', 'src/content/events/**/*.mov', 'src/content/events/**/*.MOV', 'src/content/events/**/*.webm', 'src/content/events/**/*.m4v') }}
          restore-keys: videos-
      - name: Restore processed images
        id: image-cache
        uses: actions/cache/restore@v6
        with:
          path: .astro-cache
          key: astro-assets-${{ hashFiles('src/content/**/*.webp', 'src/content/**/*.jpg', 'src/content/**/*.png', 'src/content/**/*.svg', 'src/assets/**') }}
          restore-keys: astro-assets-
      - name: Build
        shell: bash
        run: npm run build 2>&1 | tee build.log; exit "${PIPESTATUS[0]}"
      - name: Save compressed videos
        if: steps.video-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .video-cache
          key: ${{ steps.video-cache.outputs.cache-primary-key }}
      - name: Save processed images
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .astro-cache
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Upload as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Report the failure to the owner
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/report-failure.cjs');
            await report({ github, context, logFiles: ['check-content.log', 'build.log', 'audit.log'] });

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        if: failure()
        with:
          sparse-checkout: .github/scripts
      - name: Report the failure to the owner
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/report-failure.cjs');
            await report({ github, context, logFiles: [] });
