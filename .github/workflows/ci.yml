name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests on fixture content
        run: npm run e2e

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the real site
        run: npm run build
      - name: Upload as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
