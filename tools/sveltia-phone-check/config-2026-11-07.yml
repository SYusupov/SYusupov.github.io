# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.266.0/schema/sveltia-cms.json

# Test backend: entries and assets live in the browser's origin private file system, so no
# sign-in and no repository are needed. On the real site this block becomes
#   name: github
#   repo: <owner>/<repo>
#   branch: main
backend:
  name: test-repo

media_folder: /assets/uploads
public_folder: /assets/uploads

i18n:
  structure: single_file
  locales: [ru, uz, en]
  default_locale: ru

# Built-in image optimization: every raster image picked for upload (JPEG, PNG, HEIC, ...) is
# re-encoded in the browser as WebP, scaled down to fit 2000 x 2000 px. Smaller images are not
# scaled up. `raster_image` also turns on HEIC conversion for Image fields.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2000
        height: 2000

collections:
  - name: events
    label: Events
    label_singular: Event
    folder: /content/events
    format: json
    create: true
    i18n: true
    # No title field: the file name comes from the event date and type.
    slug: '{{year}}-{{month}}-{{day}}-{{type}}'
    summary: "{{date | date('DD.MM.YYYY')}} - {{type}} {{client}}"
    thumbnail: cover
    media_folder: /assets/events
    public_folder: /assets/events
    fields:
      - name: date
        label: Date
        widget: datetime
        type: date
      - name: type
        label: Type
        widget: select
        options:
          - { label: Wedding, value: wedding }
          - { label: Birthday, value: birthday }
          - { label: Kids party, value: kids-party }
          - { label: Corporate, value: corporate }
          - { label: Exhibition / presentation, value: exhibition }
          - { label: Opening, value: opening }
      - name: client
        label: Client company
        widget: string
        required: false
      - name: cover
        label: Cover photo
        widget: image
      - name: gallery
        label: Gallery
        widget: image
        multiple: true
        min: 6
        max: 15
      # The only translated field: ru / uz / en each get their own text.
      - name: description
        label: Short description
        widget: text
        required: false
        i18n: true

  - name: promotions
    label: Promotions
    label_singular: Promotion
    folder: /content/promotions
    format: json
    create: true
    i18n: true
    slug: '{{year}}-{{month}}-{{day}}-{{uuid_shorter}}'
    summary: "{{title}} (until {{valid_until | date('DD.MM.YYYY')}})"
    thumbnail: photo
    media_folder: /assets/promotions
    public_folder: /assets/promotions
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: text
        label: Text
        widget: text
        i18n: true
      - name: photo
        label: Photo
        widget: image
      - name: valid_until
        label: Valid until
        widget: datetime
        type: date

  - name: settings
    label: Settings
    files:
      - name: prices
        label: Price table
        file: content/settings/prices.json
        fields:
          - { name: package_basic, label: Basic package, widget: number, value_type: int, min: 0 }
          - { name: package_standard, label: Standard package, widget: number, value_type: int, min: 0 }
          - { name: package_premium, label: Premium package, widget: number, value_type: int, min: 0 }
          - { name: extra_hour, label: Extra hour, widget: number, value_type: int, min: 0 }
          - { name: delivery, label: Delivery, widget: number, value_type: int, min: 0 }
          - { name: setup, label: Setup, widget: number, value_type: int, min: 0 }
          - { name: decoration, label: Decoration, widget: number, value_type: int, min: 0 }
          - { name: staff_per_hour, label: Staff per hour, widget: number, value_type: int, min: 0 }
          - { name: deposit_percent, label: Deposit percent, widget: number, value_type: int, min: 0, max: 100 }
          - { name: minimum_order, label: Minimum order, widget: number, value_type: int, min: 0 }
